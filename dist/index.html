<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="vapid-public-key" content="{{.VAPIDPublicKey}}">
    <meta name="max-file-size" content="{{.MaxFileSize}}">
    <meta name="app-version" content="{{.Version}} · {{printf "%.7s" .Commit}} · {{.BuildDate}}">
    <meta name="app-hash" content="{{.AssetHash}}">
    <title>ChatBit SecureChat</title>
    <meta name="description" content="ChatBit SecureChat">
    <meta name="keywords" content="bootstrap 5, mobile template, cordova, phonegap, mobile, html" />

    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">

    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/lib/jquery-3.7.0.min.js"></script>
    <script src="assets/js/lib/dexie.min.js"></script>
    <script src="assets/js/lib/qrcode.min.js"></script>
    <script src="assets/js/lib/zxing/barcode-detector-3.0.8.min.js"></script>
    <link rel="manifest" href="manifest.json">
</head>

<body class="bg-white dark-mode-active">

    <!-- loader -->
    <div id="loader">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
    <!-- * loader -->

    <!-- App Header -->
    <div id="appHeader"></div>
    <!-- * App Header -->

    <!-- App ChatBit -->
    <div id="appContent"></div>
    <!-- * App ChatBit -->

    <!-- ============== Js Files ==============  -->
    <!-- Bootstrap -->
    <script src="assets/js/lib/bootstrap.min.js"></script>
    <!-- Ionicons  TODO sollte in server sein-->
    <!-- served locally (npm ionicons@5.5.2, sha512 checked) — no third-party script with access to the keys -->
    <script type="module" src="assets/js/lib/ionicons-5.5.2/ionicons.esm.js"></script>
    <!-- Splide -->
    <script src="assets/js/plugins/splide/splide.min.js"></script>
    <!-- Base Js File -->
    <script type="module" src="assets/js/index.js"></script>
    <script src="assets/js/base.js?t=8"></script>
</body>

</html>
